name: release

# Publishes a GitHub Release whenever a vX.Y.Z tag is pushed. The release
# assets are what players download (browser, no terminal) and what the app
# itself consumes for its fully automatic self-update:
#
#   starlance-app-<os>-<arch>.zip          the binary (must contain exactly one file)
#   starlance-app-<os>-<arch>.zip.sha256   sha256sum checksum for manual checks
#   starlance-app-<os>-<arch>.zip.minisig  minisign signature, checked by the updater
#   starlance-app-windows-<arch>.exe       the same Windows binary, unpacked for the
#                                          website's one-click download (the updater
#                                          filters it out)
#   starlance-app-linux-<arch>.AppImage    the same Linux binary, single-file download
#   starlance-app-macos-universal.zip      the .app bundle, one download for both Macs
#
# Asset names and the single-binary zip shape are the contract detected by
# github.com/creativeprojects/go-selfupdate (update.go): assets suffixed
# -<os>-<arch>.zip, archive containing exactly the binary named
# starlance-app(.exe). The updater fetches <zip>.minisig and verifies it
# against the public key embedded in minisign.pub; the secret key lives only in
# the protected "release" environment. Change workflow, signing and update.go
# together.
#
# macOS additionally ships a universal double-clickable .app zip for the first
# install (Finder + Dock icon). Its name deliberately avoids the "darwin"
# token the library matches on, so the updater only ever sees the plain-binary
# zips and replaces Contents/MacOS/starlance-app inside the bundle.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Fetch pinned artwork
        run: go run ./tools/fetchassets

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    needs: gate
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: starlance-app
            tags: production,webkit2_41
            cgo: "1"
            ldflags: ""
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            binary: starlance-app.exe
            tags: production
            cgo: "0"
            ldflags: "-H windowsgui"
          - runner: macos-15-intel # Intel
            goos: darwin
            goarch: amd64
            binary: starlance-app
            tags: production
            cgo: "1"
            ldflags: ""
          - runner: macos-15 # Apple silicon
            goos: darwin
            goarch: arm64
            binary: starlance-app
            tags: production
            cgo: "1"
            ldflags: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux window dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Fetch pinned artwork
        run: go run ./tools/fetchassets

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          go build -tags "${{ matrix.tags }}" -trimpath \
            -ldflags "-s -w ${{ matrix.ldflags }} -X main.Version=${VERSION}" \
            -o "dist/${{ matrix.binary }}" ./app

      # Linux one-click download: a single executable file, no extraction.
      # Thin like the zip: it uses the host's GTK/WebKit.
      - name: Package Linux AppImage
        if: matrix.goos == 'linux'
        run: |
          packaging/linux/build-appimage.sh \
            "dist/${{ matrix.binary }}" \
            "dist/starlance-app-linux-${{ matrix.goarch }}.AppImage"

      - name: Package binary
        run: |
          cd dist
          zip -q "starlance-app-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "${{ matrix.binary }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # One-click website download: the exe the zip carries, unpacked.
            mv "${{ matrix.binary }}" "starlance-app-windows-${{ matrix.goarch }}.exe"
          else
            rm "${{ matrix.binary }}"
          fi
          for f in *.zip *.exe *.AppImage; do
            [ -e "$f" ] || continue
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          ls -l

      # macOS first install: Finder needs a bundle (Dock icon, Gatekeeper
      # dialog). Built once, universal, so Intel Macs on browsers without user
      # agent hints get the same download as Apple silicon. The plain per-arch
      # zips above stay the updater payload.
      - name: Package macOS app bundle
        if: matrix.goos == 'darwin' && matrix.goarch == 'arm64'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="dist/StarLance App.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" \
              go build -tags production -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION}" \
              -o "dist/starlance-app-darwin-${arch}-bundle" ./app
          done
          lipo -create \
            dist/starlance-app-darwin-arm64-bundle \
            dist/starlance-app-darwin-amd64-bundle \
            -output "$APP/Contents/MacOS/starlance-app"
          rm dist/starlance-app-darwin-*-bundle
          sh packaging/macos/make-icns.sh app/assets/sl-logo.png "$APP/Contents/Resources/AppIcon.icns"
          sed -e "s/__VERSION__/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cd dist
          # No "darwin" in this name on purpose: the updater must not match it.
          zip -qry "starlance-app-macos-universal.zip" "StarLance App.app"
          sha256sum "starlance-app-macos-universal.zip" \
            | awk '{print $1}' > "starlance-app-macos-universal.zip.sha256"
          rm -rf "StarLance App.app"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sign release assets
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: go run ./tools/signrelease dist/*.zip dist/*.exe dist/*.AppImage

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip dist/*.exe dist/*.AppImage dist/*.sha256 dist/*.minisig \
            --repo "${GITHUB_REPOSITORY}" \
            --title "StarLance App ${GITHUB_REF_NAME}" \
            --generate-notes
