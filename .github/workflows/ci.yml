name: ci

# Build and test checks on every push and pull request. Release tags still
# run their own vet/test/vulnerability gate before anything is published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Fetch pinned artwork
        run: go run ./tools/fetchassets

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: starlance-app
            tags: production,webkit2_41
            cgo: "1"
            ldflags: ""
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            binary: starlance-app.exe
            tags: production
            cgo: "0"
            ldflags: "-H windowsgui"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux window dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Fetch pinned artwork
        run: go run ./tools/fetchassets

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -tags "${{ matrix.tags }}" -trimpath \
            -ldflags "-s -w ${{ matrix.ldflags }} -X main.Version=ci" \
            -o "dist/${{ matrix.binary }}" ./app
